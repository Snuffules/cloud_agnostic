apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

nameSuffix: -azure

images:
  - name: app-image
    newName: ACR_NAME.azurecr.io/myapp
    newTag: v1.0.0

configMapGenerator:
  - name: cloud-config
    namespace: myapp
    behavior: replace
    literals:
      - CLOUD_PROVIDER=azure

patches:
  - path: serviceaccount-patch.yaml
  - path: deployment-patch.yaml
