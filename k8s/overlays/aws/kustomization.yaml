apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

nameSuffix: -aws

images:
  - name: app-image
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/myapp
    newTag: v1.0.0

configMapGenerator:
  - name: cloud-config
    namespace: myapp
    behavior: replace
    literals:
      - CLOUD_PROVIDER=aws

patches:
  - path: serviceaccount-patch.yaml
